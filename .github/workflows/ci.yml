name: CI - Build & Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Create env files for CI
        run: |
          cat <<EOF > .env.src
          WAREHOUSE_HOST=postgres
          WAREHOUSE_PORT=5432
          WAREHOUSE_DB=rcm_papers
          WAREHOUSE_USER=admin
          WAREHOUSE_PASSWORD=admin
          GOOGLE_API_KEY=test
          EOF

          cat <<EOF > .env.backend
          SPRINGER_API_KEY=test
          SCOPUS_API_KEY=test
          GOOGLE_API_KEY=test
          EOF

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Run dev deployment script
        run: |
          chmod +x deploy_dev.sh
          ./deploy_dev.sh

      - name: Shutdown containers
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v
